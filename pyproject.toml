[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lcrisk"
version = "1.0.0"
description = "Lung cancer risk stratification with calibrated probabilities and an auditable evaluation trail (research use only)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "scikit-learn==1.7.2",
    "pandas==2.3.3",
    "numpy==2.5.2",
    "joblib==1.5.3",
]

[project.optional-dependencies]
app = ["streamlit==1.62.0"]
dev = ["pytest==9.0.1", "pytest-cov==7.0.0"]

[project.scripts]
lcrisk-train = "lcrisk.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
filterwarnings = [
    "error::sklearn.exceptions.InconsistentVersionWarning",
]

[tool.coverage.run]
source = ["lcrisk"]
branch = true
